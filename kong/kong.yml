plugins:
  # ── Global rate limiting (Redis-backed) ────────────────────────────────────
  - name: rate-limiting
    config:
      minute: 1000
      policy: redis
      redis_host: redis
      redis_port: 6379
      redis_password: daos_redis_password
      fault_tolerant: true
      hide_client_headers: false

  # ── Global CORS ────────────────────────────────────────────────────────────
  - name: cors
    config:
      origins:
        - '*'
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-Tenant-Id
        - X-Request-Id
      exposed_headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - X-RateLimit-Reset
      credentials: true
      max_age: 3600
      preflight_continue: false

  # ── Global request transformer (forward metadata headers) ──────────────────
  - name: request-transformer
    config:
      add:
        headers:
          - "x-forwarded-by:kong-gateway"
      remove:
        headers:
          - x-kong-debug

  # ── JWT on protected routes (auth endpoints excluded) ─────────────────────
  - name: jwt
    service: investors-service
    config:
      key_claim_name: kid
      claims_to_verify:
        - exp
      secret_is_base64: false
      run_on_preflight: false

  - name: jwt
    service: assets-service
    config:
