routes:
  # Identity routes
  - name: identity-auth-route
    paths: ["/auth", "/tenants", "/users", "/roles"]
    service: identity-service

  # Me composition route
  - name: me-route
    paths: ["/me"]
    service: identity-service

  # Bounded-context routes (explicit)
  - name: investors-route
    paths: ["/investors", "/investors/"]
    service: investors-service

  - name: assets-route
    paths: ["/assets", "/assets/"]
    service: assets-service

  - name: opportunities-route
    paths: ["/opportunities", "/opportunities/"]
    service: opportunities-service

  - name: deals-route
    paths: ["/deals", "/deals/"]
    service: deals-service

  - name: entities-route
    paths: ["/entities", "/entities/"]
    service: entities-service

  - name: products-route
    paths: ["/products", "/products/"]
    service: products-service

  - name: issuances-route
    paths: ["/issuances", "/issuances/"]
    service: issuances-service

  - name: subscriptions-route
    paths: ["/subscriptions", "/subscriptions/"]
    service: subscriptions-service

  - name: listings-route
    paths: ["/listings", "/listings/"]
    service: listings-service

  - name: settlements-route
    paths: ["/settlements", "/settlements/"]
    service: settlements-service

  - name: distributions-route
    paths: ["/distributions", "/distributions/"]
    service: distributions-service

  - name: compliance-route
    paths: ["/compliance", "/compliance/"]
    service: compliance-service

  - name: reports-route
    paths: ["/reports", "/reports/"]
    service: reports-service

  - name: documents-route
    paths: ["/documents", "/documents/"]
    service: documents-service

  - name: captables-route
    paths: ["/cap-tables", "/cap-tables/"]
    service: captables-service

  - name: notifications-route
    paths: ["/notifications", "/notifications/"]
    service: notifications-service

  - name: wallets-route
    paths: ["/wallets", "/wallets/"]
    service: wallets-service

  - name: prices-route
    paths: ["/prices", "/prices/"]
    service: prices-service

  - name: risks-route
    paths: ["/risks", "/risks/"]
    service: risks-service

  - name: proposals-route
    paths: ["/proposals", "/proposals/"]
    service: proposals-service

  # Alias routes for services with multiple prefixes
  - name: capital-calls-route
    paths: ["/capital-calls", "/capital-calls/"]
    service: capital-calls-alias

  - name: closings-route
    paths: ["/closings", "/closings/"]
    service: closings-alias

  - name: orders-route
    paths: ["/orders", "/orders/"]
    service: orders-alias

  - name: trades-route
    paths: ["/trades", "/trades/"]
    service: trades-alias

  - name: corporate-actions-route
    paths: ["/corporate-actions", "/corporate-actions/"]
    service: corporate-actions-alias

  - name: statements-route
    paths: ["/statements", "/statements/"]
    service: statements-alias

  - name: valuations-route
    paths: ["/valuations", "/valuations/"]
    service: valuations-alias

  - name: votes-route
    paths: ["/votes", "/votes/"]
    service: votes-alias

  - name: meetings-route
    paths: ["/meetings", "/meetings/"]
    service: meetings-alias