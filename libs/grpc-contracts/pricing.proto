syntax = "proto3";

package daos.pricing.v1;

service PricingService {
  rpc GetCurrentPrice(GetCurrentPriceRequest) returns (GetCurrentPriceResponse);
  rpc GetNavPerShare(GetNavPerShareRequest) returns (GetNavPerShareResponse);
}

message GetCurrentPriceRequest {
  string product_id = 1;
  string pricing_source = 2;
}

message GetCurrentPriceResponse {
  string product_id = 1;
  double price = 2;
  string currency = 3;
  string timestamp = 4;
  string source = 5;
  string review_status = 6;
}

message GetNavPerShareRequest {
  string product_id = 1;
  string as_of_date = 2;
}

message GetNavPerShareResponse {
  string product_id = 1;
  double nav = 2;
  double shares_outstanding = 3;
  double nav_per_share = 4;
  string currency = 5;
  string as_of_date = 6;
  string timestamp = 7;
}
