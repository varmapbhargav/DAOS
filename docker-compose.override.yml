version: '3.9'

# Development overrides — not committed to production deployments.
# Exposes additional ports for direct debugging with sidecars.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: daos_dev_password
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  kafka:
    environment:
      KAFKA_MESSAGE_MAX_BYTES: 10485760

  kong-gateway:
    ports:
      - '8002:8002'

  kuma-cp:
    ports:
      - '5681:5681'
      - '5680:5680'
